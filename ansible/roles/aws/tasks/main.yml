- name: Create .aws directory for ec2-user
  ansible.builtin.file:
    path: /home/ec2-user/.aws
    state: directory
    owner: ec2-user
    group: ec2-user
    mode: '0700'

- name: Configure AWS profile
  ansible.builtin.copy:
    src: aws-config
    dest: /home/ec2-user/.aws/config
    owner: ec2-user
    group: ec2-user
    mode: '0600'

- name: Set AWS_PROFILE in bash
  ansible.builtin.lineinfile:
    path: /home/ec2-user/.bashrc
    line: 'export AWS_PROFILE=development-eu-west-2'
    state: present

- name: Install amazon-ecr-credential-helper
  ansible.builtin.dnf:
    name: amazon-ecr-credential-helper
    state: latest

- name: Create .docker directory for ec2-user
  ansible.builtin.file:
    path: /home/ec2-user/.docker
    state: directory
    owner: ec2-user
    group: ec2-user
    mode: '0700'

- name: Configure ECR credential helper
  ansible.builtin.copy:
    src: docker-config.json
    dest: /home/ec2-user/.docker/config.json
    owner: ec2-user
    group: ec2-user
    mode: '0600'

- name: Install CloudWatch Agent
  ansible.builtin.dnf:
    name: amazon-cloudwatch-agent
    state: present
